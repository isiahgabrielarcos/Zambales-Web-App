<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create your Zambales Tourism account." />
  <title>Sign Up | Zambales, Philippines</title>
  <link rel="icon" href="../assets/images/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>

<!-- ── NAV (injected by components.js) ───────────────────── -->
<div id="nav-placeholder"></div>
<div style="height:72px"></div>

<!-- ╔══════════════════════════════════════════════════════════╗
     ║  SIGN UP FORM                                           ║
     ╚══════════════════════════════════════════════════════════╝ -->
<section class="signup-section" aria-label="Create account">
  <div class="signup-card">

    <span class="signup-logo">LARGA!</span>
    <h1 class="signup-title">Create Account</h1>
    <p class="signup-sub">Join the community and start planning your Zambales adventure.</p>

    <form id="signup-form" novalidate>

      <div class="form-group">
        <label for="signup-name">Full Name <span style="color:var(--coral)">*</span></label>
        <input type="text" id="signup-name" name="name" placeholder="Juan dela Cruz" required />
      </div>

      <div class="form-group">
        <label for="signup-email">Email Address <span style="color:var(--coral)">*</span></label>
        <input type="email" id="signup-email" name="email" placeholder="juan@email.com" required />
      </div>

      <div class="form-group">
        <label for="signup-password">Password <span style="color:var(--coral)">*</span></label>
        <input type="password" id="signup-password" name="password"
               placeholder="At least 8 characters" required minlength="8" />
      </div>

      <div class="form-group">
        <label for="signup-confirm">Confirm Password <span style="color:var(--coral)">*</span></label>
        <input type="password" id="signup-confirm" name="confirm_password"
               placeholder="Repeat your password" required />
      </div>

      <div style="font-size:0.78rem;color:var(--stone);margin-bottom:1rem;line-height:1.6">
        By creating an account you agree to our
        <a href="#" style="color:var(--ocean);font-weight:600">Terms of Use</a> and
        <a href="#" style="color:var(--ocean);font-weight:600">Privacy Policy</a>.
      </div>

      <button type="submit" class="signup-btn">Create Account</button>

    </form>

    <div class="signup-divider">or</div>

    <button class="signin-provider-btn" style="margin-bottom:0" id="google-signup">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign up with Google
    </button>

    <div class="signup-footer-link">
      Already have an account?
      <a href="#" data-open-signin>Sign In</a>
    </div>

  </div>
</section>


<!-- ── FOOTER (injected by components.js) ─────────────────── -->
<div id="footer-placeholder"></div>

<script src="../assets/js/components.js" defer></script>
<script src="../assets/js/main.js" defer></script>
</body>
</html>
