<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Hotels, resorts, and accommodations in Zambales, Philippines." />
  <title>Accommodations | Zambales, Philippines</title>
  <link rel="icon" href="../assets/images/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>

<div id="nav-placeholder"></div>

<!-- HERO -->
<div class="page-hero" style="background-image:url('https://images.unsplash.com/photo-1571003123894-1f0594d2b5d9?w=1800&q=85')" aria-label="Accommodations hero">
  <div class="page-hero-content">
    <p class="section-label">Hotels · Resorts · Homestays</p>
    <h1>Where to <em style="font-style:italic;font-family:var(--ff-display);color:var(--sand)">Stay</em> in Zambales</h1>
  </div>
</div>

<!-- FILTER -->
<div class="accom-filter" role="navigation" aria-label="Accommodation filter">
  <button class="filter-btn active" data-type="all">All</button>
  <button class="filter-btn" data-type="resort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 0 1 9 9H3a9 9 0 0 1 9-9Z"/><path d="M12 12v9"/><path d="M8 21h8"/></svg> Resorts</button>
  <button class="filter-btn" data-type="hotel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="1"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M16 14h.01"/></svg> Hotels</button>
  <button class="filter-btn" data-type="inn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7"/><path d="M5 9v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9"/><path d="M9 21v-6h6v6"/></svg> Inns &amp; B&amp;Bs</button>
</div>

<!-- GRID -->
<section class="section" style="padding:4rem">
  <div class="accom-grid" id="accom-grid">
    <p id="accom-loading" style="grid-column:1/-1;text-align:center;color:var(--stone);padding:3rem 0">Loading accommodations…</p>
  </div>
</section>

<div id="footer-placeholder"></div>
<script src="../assets/js/components.js" defer></script>
<script src="../assets/js/main.js" defer></script>
<script>
const LOCATION_ICON = '<svg class="txt-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>';
const GLOBE_ICON    = '<svg class="txt-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"/></svg>';
const AVATAR_COLORS = ['#0b3589','#b71022','#b45a00','#10b981','#e85d04','#6b7280'];
const VISIBLE_REVIEWS = 2;
const TYPE_LABELS = { resort: 'Resort', hotel: 'Hotel', inn: 'Inn' };

function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function getUser() {
  try { return JSON.parse(localStorage.getItem('zam_user') || 'null'); } catch { return null; }
}

function colorForName(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[hash % AVATAR_COLORS.length];
}

function initialsForName(name) {
  return name.trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
}

function reviewItemHTML(review) {
  const stars = '★'.repeat(review.rating) + '☆'.repeat(5 - review.rating);
  return `
    <div class="review-item">
      <div class="review-avatar" style="background:${colorForName(review.user_name)}">${esc(initialsForName(review.user_name))}</div>
      <div class="review-content">
        <div class="review-meta"><span class="review-name">${esc(review.user_name)}</span><span class="review-stars">${stars}</span></div>
        <div class="review-text">${esc(review.comment)}</div>
      </div>
    </div>`;
}

function reviewFormSectionHTML(accom) {
  if (!getUser()) {
    return `<p class="review-signin-prompt">Want to share your stay? <a href="#" class="open-signin-link">Sign in</a> to leave a review.</p>`;
  }
  return `
    <button class="review-form-toggle" onclick="toggleReviewForm('rform-${accom.id}')">+ Leave a Review</button>
    <div class="review-form" id="rform-${accom.id}" style="display:none">
      <label>Rating</label>
      <div class="star-input" id="stars-${accom.id}">
        <span onclick="setStars('stars-${accom.id}',1)">★</span>
        <span onclick="setStars('stars-${accom.id}',2)">★</span>
        <span onclick="setStars('stars-${accom.id}',3)">★</span>
        <span onclick="setStars('stars-${accom.id}',4)">★</span>
        <span onclick="setStars('stars-${accom.id}',5)">★</span>
      </div>
      <label>Your Review</label>
      <textarea rows="3" placeholder="Share your experience…" id="rtext-${accom.id}"></textarea>
      <p class="review-error-msg" id="rerror-${accom.id}" style="display:none;color:var(--coral);font-size:0.8rem;margin-bottom:0.6rem"></p>
      <button class="review-submit-btn" onclick="submitReview(${accom.id})">Submit Review</button>
    </div>`;
}

function accomCardHTML(accom) {
  const starsDisplay = '★'.repeat(accom.stars) + '☆'.repeat(5 - accom.stars);
  const reviewItems = accom.reviews.length
    ? accom.reviews.map(reviewItemHTML).join('')
    : `<p class="review-empty-msg" style="color:var(--stone);font-size:0.85rem">No reviews yet — be the first to share your experience!</p>`;

  return `
    <div class="accom-card" data-type="${esc(accom.type)}" data-id="${accom.id}">
      <div class="accom-card-img">
        <img src="${esc(accom.image_url)}" alt="${esc(accom.name)}" loading="lazy" />
        <span class="accom-type-badge">${TYPE_LABELS[accom.type] || accom.type}</span>
      </div>
      <div class="accom-body">
        <div class="accom-name">${esc(accom.name)}</div>
        <div class="accom-stars">${starsDisplay}</div>
        <p class="accom-desc">${esc(accom.description)}</p>
        <div class="accom-location">${LOCATION_ICON}${esc(accom.location)}</div>
      </div>
      <div class="accom-actions">
        <a href="${esc(accom.website_url || '#')}" class="accom-btn accom-btn-primary">${GLOBE_ICON}Visit Website</a>
        <a href="${esc(accom.maps_url || '#')}" target="_blank" rel="noopener noreferrer" class="accom-btn accom-btn-outline">${LOCATION_ICON}Google Maps</a>
      </div>
      <div class="accom-reviews">
        <div class="accom-reviews-title">Guest Reviews</div>
        <div id="reviews-${accom.id}">${reviewItems}</div>
        ${reviewFormSectionHTML(accom)}
      </div>
    </div>`;
}

/* ── LOAD ACCOMMODATIONS ──────────────────────────────────── */
async function loadAccommodations() {
  const grid = document.getElementById('accom-grid');
  try {
    const res = await fetch('../api/accommodations.php');
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Failed to load accommodations.');

    grid.innerHTML = data.data.map(accomCardHTML).join('');
    data.data.forEach(accom => refreshReviewToggle('reviews-' + accom.id));
    applyFilter();

    grid.querySelectorAll('.open-signin-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        document.getElementById('open-signin')?.click();
      });
    });
  } catch (err) {
    grid.innerHTML = `<p style="grid-column:1/-1;text-align:center;color:var(--coral);padding:3rem 0">Could not load accommodations. Please try again later.</p>`;
  }
}

/* ── FILTER ──────────────────────────────────────────────── */
function applyFilter() {
  const active = document.querySelector('.accom-filter .filter-btn.active');
  const type = active ? active.dataset.type : 'all';
  document.querySelectorAll('.accom-card').forEach(card => {
    card.style.display = (type === 'all' || card.dataset.type === type) ? '' : 'none';
  });
}
document.querySelectorAll('.accom-filter .filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.accom-filter .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilter();
  });
});

/* ── REVIEW FORM TOGGLE ──────────────────────────────────── */
function toggleReviewForm(id) {
  const el = document.getElementById(id);
  el.style.display = el.style.display === 'none' ? '' : 'none';
}

/* ── REVIEW SEE MORE / SEE LESS ──────────────────────────── */
function refreshReviewToggle(listId) {
  const list = document.getElementById(listId);
  if (!list) return;
  const items = Array.from(list.querySelectorAll('.review-item'));
  let toggle = document.getElementById('toggle-' + listId);

  if (items.length <= VISIBLE_REVIEWS) {
    items.forEach(item => item.style.display = '');
    if (toggle) toggle.remove();
    return;
  }

  if (!toggle) {
    toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'review-see-more';
    toggle.id = 'toggle-' + listId;
    toggle.dataset.expanded = 'false';
    toggle.addEventListener('click', () => {
      toggle.dataset.expanded = toggle.dataset.expanded === 'true' ? 'false' : 'true';
      refreshReviewToggle(listId);
    });
    list.insertAdjacentElement('afterend', toggle);
  }

  const expanded = toggle.dataset.expanded === 'true';
  items.forEach((item, i) => item.style.display = (expanded || i < VISIBLE_REVIEWS) ? '' : 'none');
  toggle.textContent = expanded ? 'See Less' : `See More (${items.length - VISIBLE_REVIEWS})`;
}

/* ── STAR RATING ─────────────────────────────────────────── */
function setStars(containerId, rating) {
  const stars = document.querySelectorAll('#' + containerId + ' span');
  stars.forEach((s, i) => s.classList.toggle('active', i < rating));
  document.getElementById(containerId).dataset.rating = rating;
}

/* ── SUBMIT REVIEW ───────────────────────────────────────── */
async function submitReview(accommodationId) {
  const starsEl  = document.getElementById('stars-' + accommodationId);
  const textEl   = document.getElementById('rtext-' + accommodationId);
  const errorEl  = document.getElementById('rerror-' + accommodationId);
  const rating   = parseInt(starsEl.dataset.rating || 0);
  const comment  = textEl.value.trim();

  errorEl.style.display = 'none';

  if (!rating || !comment) {
    errorEl.textContent = 'Please choose a rating and write your review.';
    errorEl.style.display = '';
    return;
  }

  try {
    const res = await fetch('../api/reviews.php', {
      method: 'POST',
      credentials: 'same-origin',
      body: new URLSearchParams({ accommodation_id: accommodationId, rating, comment }),
    });

    if (res.status === 401) {
      localStorage.removeItem('zam_user');
      window.location.reload();
      return;
    }

    const data = await res.json();

    if (!data.success) {
      errorEl.textContent = data.error || (data.errors && data.errors[0]) || 'Something went wrong.';
      errorEl.style.display = '';
      return;
    }

    const list = document.getElementById('reviews-' + accommodationId);
    const emptyMsg = list.querySelector('.review-empty-msg');
    if (emptyMsg) emptyMsg.remove();
    list.insertAdjacentHTML('afterbegin', reviewItemHTML(data.review));

    document.getElementById('rform-' + accommodationId).style.display = 'none';
    textEl.value = '';
    document.querySelectorAll('#stars-' + accommodationId + ' span').forEach(s => s.classList.remove('active'));
    delete starsEl.dataset.rating;
    refreshReviewToggle('reviews-' + accommodationId);
  } catch (err) {
    errorEl.textContent = 'Could not reach the server. Please try again.';
    errorEl.style.display = '';
  }
}

loadAccommodations();
</script>
</body>
</html>
